services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER= compgo_user
      - POSTGRES_PASSWORD= ${DB_PASSWORD}
      - POSTGRES_DB= compgo
    volumes:
       - pgdata:/var/lib/postgresql/data

  
  backend:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://compgo_user:${DB_PASSWORD}@postgres:5432/compgo
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      ADMIN_API_KEY: ${ADMIN_KEY}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      # Self-hosted road routing (see /root/osrm on the server) - trip
      # distance = driving distance like Google Maps. Falls back to
      # straight-line distance if it is unreachable.
      OSRM_URL: http://osrm:5000
      # Optional: when set, trip distance comes from Google (see roadDistance.ts).
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_ROUTES_DAILY_LIMIT: ${GOOGLE_ROUTES_DAILY_LIMIT:-300}
    networks:
      - default
      - osrm_net
    volumes:
      # Without this, every uploaded captain document (national ID,
      # license, vehicle license, profile photo) lives only in the
      # container's writable layer and is silently wiped on the next
      # `--force-recreate`/rebuild (see config/upload.ts - it writes to
      # ./uploads, i.e. /app/uploads here). This volume makes uploads
      # survive deploys.
      - uploads:/app/uploads
    depends_on:
      - postgres

networks:
  osrm_net:
    external: true

volumes:
  pgdata:
  uploads:


